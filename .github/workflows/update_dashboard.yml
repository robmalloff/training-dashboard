name: Update Training Dashboard

on:
  schedule:
    - cron: '0 10 * * *'  # 6am ET daily
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install garminconnect pydantic requests

      - name: Restore Garmin tokens
        uses: actions/cache@v4
        with:
          path: .garmin_tokens
          key: garmin-tokens-${{ runner.os }}
          restore-keys: garmin-tokens-

      - name: Fetch Garmin and update dashboard
        env:
          GARMIN_EMAIL:     ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD:  ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKEN_DIR: .garmin_tokens
        run: python fetch_garmin.py

      - name: Save Garmin tokens
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .garmin_tokens
          key: garmin-tokens-${{ runner.os }}

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add training_dashboard.jsx
          git diff --staged --quiet || git commit -m "Daily dashboard update $(date +'%Y-%m-%d')"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
